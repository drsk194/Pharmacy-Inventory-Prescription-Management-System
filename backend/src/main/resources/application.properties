# ===== Application =====
spring.application.name=pipms
server.port=8080

# ===== MySQL Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/pipms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR

# ===== Swagger / OpenAPI =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ===== JWT (used from Module 2 onward) =====
jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_256_BIT_SECRET_BEFORE_PRODUCTION_USE
jwt.access-token.patient-doctor.expiration-ms=28800000
jwt.access-token.staff.expiration-ms=43200000
jwt.access-token.admin.expiration-ms=43200000
jwt.refresh-token.staff.expiration-ms=86400000
jwt.refresh-token.patient.expiration-ms=604800000
jwt.controlled-substance.reauth-window-ms=1800000

# ===== Logging =====
logging.level.com.pharmacy.pipms=DEBUG
logging.level.org.springframework.security=INFO

# ===== Procurement =====
procurement.po.approval-threshold=50000

# ===== Billing =====
billing.gst-percent=12.00
billing.dispensing-fee=20.00

# ===== Notifications =====
notification.escalation-window-minutes=60

# ===== Reporting =====
reporting.dead-stock-lookback-days=90
reporting.slow-moving-threshold=5